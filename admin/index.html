<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .login-card p {
            color: #888;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:hover { transform: translateY(-2px); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        #statusBox {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            text-align: right;
            line-height: 1.8;
        }
        #statusBox.error { display: block; background: #fee; color: #c33; border: 1px solid #fcc; }
        #statusBox.success { display: block; background: #efe; color: #2a7; border: 1px solid #beb; }
        #statusBox.info { display: block; background: #eef; color: #55a; border: 1px solid #ccf; }

        .debug-log {
            margin-top: 16px;
            background: #1a1a2e;
            color: #0f0;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            direction: ltr;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 لوحة التحكم</h2>
        <p>سجل دخولك لإدارة موقعك</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
        </form>

        <div id="statusBox"></div>
        <div class="debug-log" id="debugLog">--- Debug Console ---</div>

        <a href="../index.html" class="back-link">
            <i class='bx bx-arrow-back'></i> العودة للموقع
        </a>
    </div>

    <!-- Firebase SDK v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // === DEBUG LOGGER ===
        function log(msg) {
            console.log(msg);
            const el = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            el.innerHTML += `\n[${time}] ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.className = type;
            box.innerHTML = msg;
        }

        // === STEP 1: Initialize Firebase ===
        log("🔄 Loading Firebase...");

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyDLCKGAbYvH0Ifgp3Vp5M4LQm7Q406uiPw",
                authDomain: "portfolio-6ed42.firebaseapp.com",
                projectId: "portfolio-6ed42",
                storageBucket: "portfolio-6ed42.firebasestorage.app",
                messagingSenderId: "140699165995",
                appId: "1:140699165995:web:c6e78e258fe041c554916e"
            };

            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            log("✅ Firebase initialized OK");
            log("✅ Auth object ready: " + (auth ? "YES" : "NO"));
            log("📍 Current URL: " + window.location.href);
        } catch(e) {
            log("❌ Firebase init FAILED: " + e.message);
            showStatus("❌ فشل تحميل Firebase: " + e.message, "error");
        }

        // === STEP 2: Check if already logged in ===
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                log("✅ Already logged in as: " + user.email);
                showStatus("✅ أنت مسجل دخول بالفعل! جاري التحويل...", "success");
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            } else {
                log("ℹ️ No user logged in. Ready for login.");
            }
        });

        // === STEP 3: Login Form ===
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showStatus("⚠️ يرجى ملء جميع الحقول", "error");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'جاري تسجيل الدخول...';
            showStatus("⏳ جاري الاتصال بـ Firebase...", "info");
            log("🔄 Attempting login with: " + email);

            // Timeout after 15 seconds
            const timeout = setTimeout(() => {
                log("⏰ TIMEOUT after 15 seconds!");
                showStatus("⏰ انتهت المهلة! تأكد من اتصال الإنترنت وإعدادات Firebase.", "error");
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }, 15000);

            try {
                log("🔄 Calling signInWithEmailAndPassword...");
                const result = await firebase.auth().signInWithEmailAndPassword(email, password);
                clearTimeout(timeout);

                log("✅ LOGIN SUCCESS! User: " + result.user.email);
                log("✅ UID: " + result.user.uid);
                showStatus("✅ تم تسجيل الدخول بنجاح! جاري التحويل...", "success");

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                clearTimeout(timeout);
                log("❌ LOGIN ERROR: " + error.code);
                log("❌ Message: " + error.message);

                let msg = 'حدث خطأ في تسجيل الدخول';
                switch (error.code) {
                    case 'auth/user-not-found': msg = 'المستخدم غير موجود'; break;
                    case 'auth/wrong-password': msg = 'كلمة المرور غير صحيحة'; break;
                    case 'auth/invalid-email': msg = 'البريد الإلكتروني غير صحيح'; break;
                    case 'auth/invalid-credential': msg = 'البيانات غير صحيحة. تأكد من الإيميل والباسورد'; break;
                    case 'auth/too-many-requests': msg = 'محاولات كثيرة، حاول لاحقاً'; break;
                    case 'auth/network-request-failed': msg = 'مشكلة في اتصال الإنترنت'; break;
                    case 'auth/api-key-not-valid': msg = 'مفتاح API غير صحيح. راجع إعدادات Firebase'; break;
                }

                showStatus("❌ " + msg + "<br><small style='color:#999'>(" + error.code + ")</small>", "error");
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
