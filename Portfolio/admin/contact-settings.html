<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات التواصل - لوحة التحكم</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; }
        .admin-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: linear-gradient(180deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px 16px; position: fixed; top: 0; right: 0; bottom: 0; overflow-y: auto; }
        .sidebar-logo { text-align: center; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 24px; }
        .sidebar-logo h2 { font-size: 22px; } .sidebar-logo small { opacity: 0.7; font-size: 12px; }
        .nav-list { list-style: none; } .nav-list li { margin-bottom: 4px; }
        .nav-list a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 10px; transition: all 0.3s; }
        .nav-list a:hover, .nav-list a.active { background: rgba(255,255,255,0.2); color: white; }
        .nav-list i { font-size: 20px; }
        .main-content { flex: 1; margin-right: 260px; padding: 30px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 28px; color: #333; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background: #f0f0f0; color: #666; padding: 10px 20px; border-radius: 10px; text-decoration: none; }
        .form-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .contact-item { display: flex; align-items: center; gap: 16px; padding: 20px; margin-bottom: 16px; background: #f8f9fa; border-radius: 12px; border: 1px solid #eee; }
        .contact-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; flex-shrink: 0; }
        .contact-icon.whatsapp { background: #25d366; }
        .contact-icon.email { background: #ea4335; }
        .contact-icon.linkedin { background: #0077b5; }
        .contact-icon.tiktok { background: #000; }
        .contact-fields { flex: 1; }
        .contact-fields label { display: block; font-weight: 600; color: #555; margin-bottom: 6px; font-size: 14px; }
        .contact-fields input { width: 100%; padding: 10px 14px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 15px; direction: ltr; text-align: left; }
        .contact-fields input:focus { outline: none; border-color: #667eea; }
        .btn-save { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 14px 32px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn-save:hover { transform: translateY(-2px); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status-msg { padding: 14px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 500; }
        .status-msg.error { display: block; background: #fee; color: #c33; }
        .status-msg.success { display: block; background: #efe; color: #2a7; }
        .auth-gate { text-align: center; padding: 100px 20px; color: #666; }
        .auth-gate i { font-size: 60px; color: #ccc; margin-bottom: 16px; display: block; }
        @media (max-width: 768px) { .sidebar { position: static; width: 100%; } .main-content { margin-right: 0; } .contact-item { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
    <div id="authGate" class="auth-gate"><i class='bx bx-loader-alt bx-spin'></i><h2>جاري التحقق...</h2></div>
    <div id="pageContent" class="admin-wrapper" style="display:none">
        <aside class="sidebar">
            <div class="sidebar-logo"><h2>🎛️ لوحة التحكم</h2><small>M. El-Deeb Portfolio</small></div>
            <nav><ul class="nav-list">
                <li><a href="dashboard.html"><i class='bx bxs-dashboard'></i> الرئيسية</a></li>
                <li><a href="projects.html"><i class='bx bxs-briefcase'></i> المشاريع</a></li>
                <li><a href="hero.html"><i class='bx bx-home'></i> القسم الرئيسي</a></li>
                <li><a href="services.html"><i class='bx bx-star'></i> الخدمات</a></li>
                <li><a href="contact-settings.html" class="active"><i class='bx bx-envelope'></i> التواصل</a></li>
                <li><a href="cv.html"><i class='bx bx-file'></i> السيرة الذاتية</a></li>
                <li><a href="portfolios.html"><i class='bx bx-collection'></i> ملفات العرض</a></li>
                <li><a href="settings.html"><i class='bx bx-cog'></i> الإعدادات</a></li>
                <li><a href="../index.html" target="_blank"><i class='bx bx-external-link'></i> عرض الموقع</a></li>
            </ul></nav>
        </aside>
        <main class="main-content">
            <div class="page-header">
                <h1>📞 معلومات التواصل</h1>
                <a href="dashboard.html" class="back-btn"><i class='bx bx-arrow-back'></i> العودة</a>
            </div>
            <div id="statusMsg" class="status-msg"></div>
            <div class="form-card">
                <div class="contact-item">
                    <div class="contact-icon whatsapp"><i class='bx bxl-whatsapp'></i></div>
                    <div class="contact-fields">
                        <label>رقم الواتساب</label>
                        <input type="text" id="whatsapp" placeholder="+201000187366">
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon email"><i class='bx bx-envelope'></i></div>
                    <div class="contact-fields">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="email" placeholder="mohammed22eldeeb@gmail.com">
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon linkedin"><i class='bx bxl-linkedin'></i></div>
                    <div class="contact-fields">
                        <label>رابط LinkedIn</label>
                        <input type="url" id="linkedin" placeholder="https://www.linkedin.com/in/...">
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon tiktok"><i class='bx bxl-tiktok'></i></div>
                    <div class="contact-fields">
                        <label>رابط TikTok</label>
                        <input type="url" id="tiktok" placeholder="https://www.tiktok.com/@...">
                    </div>
                </div>
                <button class="btn-save" id="saveBtn" onclick="saveContact()"><i class='bx bx-save'></i> حفظ التغييرات</button>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        firebase.initializeApp({ apiKey:"AIzaSyDLCKGAbYvH0Ifgp3Vp5M4LQm7Q406uiPw", authDomain:"portfolio-6ed42.firebaseapp.com", projectId:"portfolio-6ed42", storageBucket:"portfolio-6ed42.firebasestorage.app", messagingSenderId:"140699165995", appId:"1:140699165995:web:c6e78e258fe041c554916e" });
        const auth = firebase.auth(), db = firebase.firestore();
        auth.onAuthStateChanged(u => { if (!u) { window.location.href='index.html'; return; } document.getElementById('authGate').style.display='none'; document.getElementById('pageContent').style.display='flex'; loadContact(); });

        async function loadContact() {
            try {
                const doc = await db.collection('content').doc('contact').get();
                if (doc.exists) {
                    const d = doc.data();
                    document.getElementById('whatsapp').value = d.whatsapp || '';
                    document.getElementById('email').value = d.email || '';
                    document.getElementById('linkedin').value = d.linkedin || '';
                    document.getElementById('tiktok').value = d.tiktok || '';
                }
            } catch(e) { showMsg('خطأ: ' + e.message, 'error'); }
        }

        async function saveContact() {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerHTML = '<i class="bx bx-loader-alt bx-spin"></i> جاري الحفظ...';
            try {
                await db.collection('content').doc('contact').set({
                    whatsapp: document.getElementById('whatsapp').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    linkedin: document.getElementById('linkedin').value.trim(),
                    tiktok: document.getElementById('tiktok').value.trim(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showMsg('✅ تم حفظ معلومات التواصل!', 'success');
            } catch(e) { showMsg('❌ خطأ: ' + e.message, 'error'); }
            btn.disabled = false; btn.innerHTML = '<i class="bx bx-save"></i> حفظ التغييرات';
        }
        function showMsg(m,t) { const el=document.getElementById('statusMsg'); el.textContent=m; el.className='status-msg '+t; window.scrollTo({top:0,behavior:'smooth'}); }
    </script>
</body>
</html>
